<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agujero Negro - Experiencia Pro</title>
<style>
body {
  margin: 0;
  text-align: center;
  background: radial-gradient(circle at center, #000010, #000000 90%);
  color: white;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  overflow: hidden;
  cursor: pointer;
  transition: filter 0.5s ease;
}
body.espagueti {
  animation: estirar 2s infinite alternate ease-in-out;
}
@keyframes estirar {
  0% { transform: scaleY(1) scaleX(1); filter: blur(0px) contrast(100%); }
  50% { transform: scaleY(1.3) scaleX(0.7); filter: blur(2px) contrast(130%); }
  100% { transform: scaleY(1) scaleX(1); filter: blur(0px) contrast(100%); }
}
#universo {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
  z-index: 2;
}
.contenedor {
  position: relative;
  display: inline-block;
  text-align: center;
}
.agujero {
  width: 250px;
  height: 250px;
  border-radius: 50%;
  background: radial-gradient(circle, black 50%, purple 80%, transparent 100%);
  box-shadow: 0 0 60px 20px rgba(150,0,255,0.4);
  animation: girar 6s linear infinite;
}
@keyframes girar {
  0% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(1.05); }
  100% { transform: rotate(360deg) scale(1); }
}
p {
  font-size: 24px;
  font-weight: bold;
  margin-top: 20px;
}
canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}
#modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.9);
  display: flex; justify-content: center; align-items: center;
  text-align: left;
  padding: 20px;
  z-index: 999;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s;
}
#modal.mostrar {
  opacity: 1;
  pointer-events: auto;
}
#modal .contenido {
  background: rgba(30, 0, 60, 0.85);
  padding: 20px;
  border-radius: 15px;
  max-width: 700px;
  box-shadow: 0 0 20px rgba(200,0,255,0.8);
}
#modal h2 { margin-top: 0; color: #ffddff; }
#modal p { font-size: 18px; line-height: 1.5; }
.botones {
  display: flex; justify-content: space-between;
  margin-top: 20px; gap: 10px;
}
button {
  padding: 10px 16px;
  border: none;
  background: #ff00ff;
  color: white;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
  transition: background 0.3s;
}
button:hover { background: #ff55ff; }
#rayModal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.96);
  display: none;
  justify-content: center; align-items: center;
  flex-direction: column;
  z-index: 2000;
}
#rayModal.mostrar { display: flex; }
#cerrarRay {
  position: absolute; top: 20px; right: 20px;
  padding: 12px 20px;
  border: none; border-radius: 50px;
  font-size: 16px; cursor: pointer;
  background: rgba(255,0,150,0.9); color: white; font-weight: bold;
  box-shadow: 0 0 10px rgba(255,0,255,0.6);
}
#cerrarRay:hover { background: rgba(255,0,200,1); }
#rayModal iframe {
  width: 90%; height: 80%; border: none;
  border-radius: 12px;
  box-shadow: 0 0 25px rgba(200,0,255,0.6);
}
</style>
</head>
<body>

<div id="universo">
  <div class="contenedor">
    <div class="agujero" id="agujero"></div>
  </div>
  <p>UN VIAJE A TRAVÉS DEL AGUJERO NEGRO 🌌</p>
</div>

<canvas id="c"></canvas>

<div id="modal">
  <div class="contenido">
    <h2 id="titulo"></h2>
    <p id="texto"></p>
    <div class="botones">
      <button id="anterior">⬅ Anterior</button>
      <div style="display:flex; gap:10px;">
        <button id="abrirRay">🌑 Ray-Traced</button>
        <button id="cerrar">❌ Cerrar</button>
      </div>
      <button id="siguiente">Siguiente ➡</button>
    </div>
  </div>
</div>

<div id="rayModal">
  <button id="cerrarRay">✖ Salir</button>
  <iframe src="https://oseiskar.github.io/black-hole/" allowfullscreen></iframe>
</div>

<!-- 🎶 Música desde Google Drive -->
<audio id="musica" loop>
  <source src="https://drive.google.com/uc?export=download&id=1lFHB6OJG4eDVMA9MMBccMzjBOrgY8b0n" type="audio/mpeg">
</audio>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W=canvas.width=innerWidth,H=canvas.height=innerHeight;
window.addEventListener('resize',()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight;});
function rand(min,max){return Math.random()*(max-min)+min;}
class Estrella{
  constructor(){this.orbita=rand(50,Math.min(W,H)/2);this.angulo=rand(0,Math.PI*2);this.vel=rand(0.001,0.005);this.tam=rand(1,3);}
  update(){this.angulo+=this.vel;}
  draw(ctx){const x=W/2+Math.cos(this.angulo)*this.orbita;const y=H/2+Math.sin(this.angulo)*this.orbita;ctx.fillStyle="white";ctx.beginPath();ctx.arc(x,y,this.tam,0,Math.PI*2);ctx.fill();}
}
const estrellas=[];for(let i=0;i<200;i++)estrellas.push(new Estrella());
function loop(){ctx.fillStyle="rgba(0,0,0,0.3)";ctx.fillRect(0,0,W,H);for(let e of estrellas){e.update();e.draw(ctx);}requestAnimationFrame(loop);}loop();

const modal=document.getElementById("modal");
const cerrar=document.getElementById("cerrar");
const anterior=document.getElementById("anterior");
const siguiente=document.getElementById("siguiente");
const titulo=document.getElementById("titulo");
const texto=document.getElementById("texto");
const abrirRay=document.getElementById("abrirRay");
const agujero=document.getElementById("agujero");

const paginas=[
  {titulo:"¿Qué es un agujero negro?",texto:"Un agujero negro es una región del espacio-tiempo con un campo gravitatorio tan intenso que nada, ni siquiera la luz, puede escapar."},
  {titulo:"Horizonte de sucesos",texto:"El límite invisible que marca el punto de no retorno."},
  {titulo:"Singularidad",texto:"El centro del agujero negro, donde la densidad es infinita y las leyes de la física dejan de aplicarse."},
  {titulo:"Tipos de agujeros negros",texto:"Estelares, supermasivos y primordiales, cada uno con distintos orígenes y masas."},
  {titulo:"Curiosidades",texto:"Al 'alimentarse' de materia cercana, pueden generar chorros de energía llamados jets relativistas."},
  {titulo:"Ondas gravitacionales",texto:"Cuando dos agujeros negros se fusionan producen ondas en el espacio-tiempo, detectadas por observatorios como LIGO y Virgo."},
  {titulo:"Espaguetificación",texto:"Un objeto que cae en un agujero negro se estira y deforma por los intensos gradientes de gravedad, fenómeno llamado espaguetificación."}
];
let paginaActual=0;
function mostrarPagina(i){
  titulo.textContent=paginas[i].titulo;
  texto.textContent=paginas[i].texto;
  if(paginas[i].titulo==="Espaguetificación"){
    document.body.classList.add("espagueti");
  } else {
    document.body.classList.remove("espagueti");
  }
}
mostrarPagina(paginaActual);

agujero.addEventListener("click",()=>{modal.classList.add("mostrar");});
cerrar.addEventListener("click",e=>{e.stopPropagation();modal.classList.remove("mostrar");document.body.classList.remove("espagueti");});
siguiente.addEventListener("click",e=>{e.stopPropagation();paginaActual=(paginaActual+1)%paginas.length;mostrarPagina(paginaActual);});
anterior.addEventListener("click",e=>{e.stopPropagation();paginaActual=(paginaActual-1+paginas.length)%paginas.length;mostrarPagina(paginaActual);});

const rayModal=document.getElementById("rayModal");
document.getElementById("cerrarRay").addEventListener("click",()=>{rayModal.classList.remove("mostrar");});
abrirRay.addEventListener("click",e=>{e.stopPropagation();rayModal.classList.add("mostrar");});

document.body.addEventListener("click",()=>{const audio=document.getElementById("musica");audio.play();},{once:true});
</script>
</body>
</html>
